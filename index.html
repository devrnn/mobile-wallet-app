<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Wallet App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Safe-area utility for modern mobile viewports */
    .pt-safe {
      padding-top: max(1.5rem, env(safe-area-inset-top));
    }
  </style>
</head>
<body class="bg-black text-white font-sans antialiased min-h-screen">

  <!-- Mobile Drawer Overlay -->
  <div id="drawer-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden" onclick="toggleMenu()"></div>

  <!-- Mobile Drawer Container -->
  <aside id="drawer" class="fixed top-0 left-0 bottom-0 w-3/4 max-w-xs bg-[#0f0f11] z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col pt-safe px-6 pb-6">
    
    <!-- Drawer Header (Fixed safe spacing from status bar) -->
    <div class="flex items-center justify-between pb-6 pt-2">
      <span class="text-xs font-semibold tracking-wider text-zinc-500 uppercase">MENU</span>
      <button onclick="toggleMenu()" class="text-zinc-400 hover:text-white p-1 focus:outline-none" aria-label="Close menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Navigation Links -->
    <nav class="space-y-2 flex-1">
      <a href="#" class="flex items-center gap-3 px-4 py-3 bg-zinc-800/80 text-white rounded-xl font-medium transition-colors">
        <svg class="w-5 h-5 text-zinc-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
        </svg>
        Overview
      </a>

      <a href="#" class="flex items-center gap-3 px-4 py-3 text-zinc-400 hover:text-white hover:bg-zinc-800/40 rounded-xl font-medium transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
        </svg>
        Exchange
      </a>

      <a href="#" class="flex items-center gap-3 px-4 py-3 text-zinc-400 hover:text-white hover:bg-zinc-800/40 rounded-xl font-medium transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
        </svg>
        Market
      </a>

      <a href="#" class="flex items-center gap-3 px-4 py-3 text-zinc-400 hover:text-white hover:bg-zinc-800/40 rounded-xl font-medium transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
        Settings
      </a>
    </nav>
  </aside>

  <!-- Demo Trigger Button -->
  <main class="p-6 pt-safe">
    <button onclick="toggleMenu()" class="px-4 py-2 bg-zinc-800 text-sm font-medium rounded-lg hover:bg-zinc-700 transition">
      Open Menu
    </button>
  </main>

  <script>
    function toggleMenu() {
      const drawer = document.getElementById('drawer');
      const backdrop = document.getElementById('drawer-backdrop');
      
      const isOpen = !drawer.classList.contains('-translate-x-full');
      
      if (isOpen) {
        drawer.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      } else {
        drawer.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
